name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build & publish — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --group build

      # Full install (no --ignore-scripts) so apps/desktop's electron-rebuild
      # postinstall compiles better-sqlite3 against the Electron ABI.
      - name: Install Node deps
        run: npm ci

      - name: Sync desktop version to release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          npm version --no-git-tag-version --workspace=@sonordia/desktop --allow-same-version "$VERSION"

      - name: Build Python bridge (PyInstaller)
        run: uv run pyinstaller bridge/analyzer.spec --noconfirm --distpath bridge/dist --workpath bridge/build
        working-directory: apps/desktop

      - name: Build desktop renderer
        run: npm run build --workspace=@sonordia/desktop

      - name: Package & publish to GitHub release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ] && [ "${{ github.event.release.prerelease }}" = "true" ]; then
            RELEASE_TYPE=prerelease
          elif [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_TYPE=release
          else
            RELEASE_TYPE=draft
          fi
          npx electron-builder --publish always --config.publish.releaseType="$RELEASE_TYPE"
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
