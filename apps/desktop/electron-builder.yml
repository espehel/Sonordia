appId: com.sonordia.desktop
productName: Sonordia
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
extraResources:
  # PyInstaller --onedir output. The contents of dist/analyzer/ become Resources/bridge/*,
  # so the executable lands at Resources/bridge/analyzer (analyzer.exe on Windows).
  - from: bridge/dist/analyzer/
    to: bridge
    filter:
      - "**/*"
  - from: ../../packages/key-prediction/checkpoints/keynet.pt
    to: checkpoints/keynet.pt
mac:
  category: public.app-category.music
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - zip
linux:
  category: AudioVideo
  target:
    - AppImage
    - deb
publish:
  provider: github
